# SonarQube analysis settings. The server URL and token are supplied at run
# time (SONAR_HOST_URL, SONAR_TOKEN) and must never be committed.
sonar.projectKey=secureinventory
sonar.projectName=SecureInventory

sonar.sources=app,Dockerfile
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.14
sonar.python.coverage.reportPaths=reports/coverage/coverage.xml
